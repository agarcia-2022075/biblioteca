<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: head('Formulario de Socio - Biblioteca Kinal')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card-custom p-4">
                <h4 class="fw-bold mb-3 text-dark">
                    <i class="bi bi-person text-primary me-2"></i>
                    <span th:text="${socio.id == null ? 'Registrar Socio' : 'Editar Socio'}">Socio</span>
                </h4>

                <form th:action="@{/socios/guardar}" th:object="${socio}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Nombre Completo</label>
                        <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej: Paolo García" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Correo Electrónico (Único)</label>
                        <input type="email" class="form-control" th:field="*{email}" placeholder="correo@ejemplo.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Teléfono</label>
                        <input type="text" class="form-control" th:field="*{telefono}" placeholder="Ej: 5555-1234" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold">Fecha de Registro</label>
                        <input type="date" class="form-control" th:field="*{fechaRegistro}">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/socios}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4">Guardar Socio</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
