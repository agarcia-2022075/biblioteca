<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: head('Crear Usuario - Biblioteca Kinal')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card-custom p-4">
                <h4 class="fw-bold mb-3 text-dark">
                    <i class="bi bi-person-plus-fill text-dark me-2"></i>Registrar Nuevo Usuario
                </h4>

                <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                    <input type="hidden" th:field="*{codigoUsuario}">

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Nombre de Usuario (Login)</label>
                        <input type="text" class="form-control" th:field="*{username}" placeholder="Ej: bibliotecario1" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Correo Institucional</label>
                        <input type="email" class="form-control" th:field="*{email}" placeholder="usuario@kinal.edu.gt" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Contraseña</label>
                        <input type="password" class="form-control" th:field="*{password}" placeholder="••••••••" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold">Rol de Seguridad</label>
                        <select class="form-select" th:field="*{rol}" required>
                            <option value="USUARIO">USUARIO (Lector / Consulta y Préstamos)</option>
                            <option value="ADMINISTRADOR">ADMINISTRADOR (Control Total)</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/usuarios}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
                        <button type="submit" class="btn btn-dark rounded-pill px-4">Guardar Usuario</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
