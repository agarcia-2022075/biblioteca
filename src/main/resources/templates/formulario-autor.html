<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: head('Formulario de Autor - Biblioteca Kinal')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card-custom p-4">
                <h4 class="fw-bold mb-3 text-dark">
                    <i class="bi bi-pen text-info me-2"></i>
                    <span th:text="${autor.id == null ? 'Nuevo Autor' : 'Editar Autor'}">Autor</span>
                </h4>

                <form th:action="@{/autores/guardar}" th:object="${autor}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Nombre del Autor</label>
                        <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej: Miguel Ángel Asturias" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold">Nacionalidad</label>
                        <input type="text" class="form-control" th:field="*{nacionalidad}" placeholder="Ej: Guatemalteca" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/autores}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
                        <button type="submit" class="btn btn-info text-white rounded-pill px-4">Guardar Autor</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
