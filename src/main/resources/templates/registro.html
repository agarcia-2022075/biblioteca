<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Biblioteca Kinal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .card-registro {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            overflow: hidden;
        }
    </style>
</head>
<body>
<div class="card-registro">
    <div class="bg-dark text-white p-4 text-center">
        <h3 class="fw-bold mb-1"><i class="bi bi-person-badge text-warning me-2"></i>Crear Cuenta de Lector</h3>
        <small class="text-white-50">Acceso a consulta de libros y solicitudes de préstamos</small>
    </div>

    <div class="p-4">
        <form th:action="@{/registro}" th:object="${usuario}" method="post">
            <div class="mb-3">
                <label class="form-label text-muted small fw-semibold">Nombre de Usuario</label>
                <input type="text" class="form-control" th:field="*{username}" placeholder="Ej: lector_kinal" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted small fw-semibold">Correo Electrónico</label>
                <input type="email" class="form-control" th:field="*{email}" placeholder="correo@kinal.edu.gt" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small fw-semibold">Contraseña</label>
                <input type="password" class="form-control" th:field="*{password}" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-warning w-100 fw-bold py-2 rounded-pill shadow-sm mb-3">
                <i class="bi bi-check2-circle me-1"></i> Registrarme
            </button>
        </form>

        <a th:href="@{/login}" class="btn btn-link w-100 text-decoration-none text-center text-muted small">
            <i class="bi bi-arrow-left me-1"></i> Volver a Iniciar Sesión
        </a>
    </div>
</div>
</body>
</html>
