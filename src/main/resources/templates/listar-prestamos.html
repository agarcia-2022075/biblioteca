<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: head('Gestión de Préstamos - Biblioteca Kinal')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-3">
    <!-- Alertas Flash -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card-custom p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h4 class="fw-bold mb-0 text-dark"><i class="bi bi-arrow-left-right me-2 text-success"></i>Registro de Préstamos</h4>
                <small class="text-muted">Historial y control de libros prestados</small>
            </div>
            <div>
                <a th:href="@{/prestamos/nuevo}" class="btn btn-success rounded-pill px-3">
                    <i class="bi bi-plus-lg me-1"></i> Realizar Nuevo Préstamo
                </a>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Socio (Lector)</th>
                    <th>Libro</th>
                    <th>F. Préstamo</th>
                    <th>F. Esperada</th>
                    <th>F. Real</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${prestamos}">
                    <td th:text="${p.id}">1</td>
                    <td>
                        <strong th:text="${p.socio != null ? p.socio.nombre : 'Sin Socio'}">Socio</strong><br>
                        <small class="text-muted" th:text="${p.socio != null ? p.socio.email : ''}"></small>
                    </td>
                    <td>
                        <span class="fw-semibold text-primary" th:text="${p.libro != null ? p.libro.titulo : 'Sin Libro'}">Libro</span>
                    </td>
                    <td th:text="${p.fechaPrestamo}">2026-10-05</td>
                    <td th:text="${p.fechaDevolucionEsperada}">2026-10-12</td>
                    <td>
                        <span th:if="${p.fechaDevolucionReal != null}" th:text="${p.fechaDevolucionReal}"></span>
                        <span th:if="${p.fechaDevolucionReal == null}" class="text-muted fst-italic">Pendiente</span>
                    </td>
                    <td>
                        <span th:if="${p.estado == 'PRESTADO'}" class="badge bg-warning text-dark">
                            <i class="bi bi-hourglass-split me-1"></i> Prestado
                        </span>
                        <span th:if="${p.estado == 'DEVUELTO'}" class="badge bg-success">
                            <i class="bi bi-check2-all me-1"></i> Devuelto
                        </span>
                    </td>
                    <td class="text-end">
                        <!-- Botón de Devolución (solo si está prestado) -->
                        <a th:if="${p.estado == 'PRESTADO' and session.rolUsuario == 'ADMINISTRADOR'}"
                           th:href="@{/prestamos/devolver/{id}(id=${p.id})}"
                           class="btn btn-outline-success btn-sm rounded-pill"
                           onclick="return confirm('¿Confirmar devolución del libro y reponer copia al inventario?');">
                            <i class="bi bi-arrow-return-left me-1"></i> Devolver
                        </a>
                        <!-- Botón de Eliminar (solo administrador) -->
                        <a th:if="${session.rolUsuario == 'ADMINISTRADOR'}"
                           th:href="@{/prestamos/eliminar/{id}(id=${p.id})}"
                           class="btn btn-outline-danger btn-sm rounded-circle ms-1"
                           onclick="return confirm('¿Deseas eliminar este registro de préstamo?');">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(prestamos)}">
                    <td colspan="8" class="text-center text-muted py-4">No se han registrado préstamos aún.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
