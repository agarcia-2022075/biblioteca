<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: head('Formulario de Libro - Biblioteca Kinal')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card-custom p-4">
                <h4 class="fw-bold mb-3 text-dark">
                    <i class="bi bi-journal-plus text-primary me-2"></i>
                    <span th:text="${libro.id == null ? 'Nuevo Libro' : 'Editar Libro'}">Libro</span>
                </h4>

                <form th:action="@{/libros/guardar}" th:object="${libro}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Título del Libro</label>
                        <input type="text" class="form-control" th:field="*{titulo}" placeholder="Ej: Cien Años de Soledad" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-semibold">ISBN</label>
                            <input type="text" class="form-control" th:field="*{isbn}" placeholder="Ej: 978-0307474728" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-semibold">Año de Publicación</label>
                            <input type="number" class="form-control" th:field="*{anioPublicaciones}" min="1500" max="2099" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Copias Disponibles (Stock)</label>
                        <input type="number" class="form-control" th:field="*{copiasDisponibles}" min="0" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Autor</label>
                        <select class="form-select" th:field="*{autor}" required>
                            <option value="">-- Seleccionar Autor --</option>
                            <option th:each="a : ${autores}" th:value="${a.id}" th:text="${a.nombre + ' (' + a.nacionalidad + ')'}"></option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold">Categoría</label>
                        <select class="form-select" th:field="*{categoria}" required>
                            <option value="">-- Seleccionar Categoría --</option>
                            <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/libros}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4">Guardar Libro</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
