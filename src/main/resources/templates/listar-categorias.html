<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: head('Categorías - Biblioteca Kinal')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-3">
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card-custom p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h4 class="fw-bold mb-0 text-dark"><i class="bi bi-tags me-2 text-warning"></i>Categorías Literarias</h4>
                <small class="text-muted">Clasificación de libros</small>
            </div>
            <div>
                <a th:href="@{/categorias/nuevo}" class="btn btn-warning rounded-pill px-3 fw-semibold">
                    <i class="bi bi-plus-lg me-1"></i> Nueva Categoría
                </a>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Nombre de la Categoría</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${categorias}">
                    <td th:text="${c.id}">1</td>
                    <td class="fw-semibold" th:text="${c.nombre}">Novela</td>
                    <td class="text-end">
                        <a th:href="@{/categorias/editar/{id}(id=${c.id})}" class="btn btn-outline-warning btn-sm rounded-circle" title="Editar">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a th:href="@{/categorias/eliminar/{id}(id=${c.id})}" class="btn btn-outline-danger btn-sm rounded-circle ms-1" onclick="return confirm('¿Eliminar esta categoría?');" title="Eliminar">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(categorias)}">
                    <td colspan="3" class="text-center text-muted py-4">No hay categorías registradas.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
