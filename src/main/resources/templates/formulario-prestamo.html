<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: head('Solicitar Préstamo - Biblioteca Kinal')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <!-- Alerta Error -->
            <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensajeError}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card-custom p-4">
                <h4 class="fw-bold mb-3 text-dark">
                    <i class="bi bi-journal-arrow-down text-success me-2"></i>Registrar Préstamo
                </h4>
                <p class="text-muted small">Al registrar el préstamo, el sistema descontará automáticamente una copia disponible del libro seleccionado.</p>

                <form th:action="@{/prestamos/guardar}" method="post">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Socio (Lector)</label>
                        <select class="form-select" name="socioId" required>
                            <option value="">-- Seleccionar Socio --</option>
                            <option th:each="s : ${socios}" th:value="${s.id}" th:text="${s.nombre + ' (' + s.email + ')'}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Libro a Prestar</label>
                        <select class="form-select" name="libroId" required>
                            <option value="">-- Seleccionar Libro (Disponibles) --</option>
                            <option th:each="l : ${libros}" th:value="${l.id}" th:text="${l.titulo + ' [' + l.copiasDisponibles + ' copias disponibles]'}"></option>
                        </select>
                        <small class="text-muted" th:if="${#lists.isEmpty(libros)}">⚠️ No hay libros con copias disponibles en este momento.</small>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold">Fecha Esperada de Devolución</label>
                        <input type="date" class="form-control" name="fechaDevolucionEsperada" th:value="${fechaEsperadaDefecto}" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/prestamos}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
                        <button type="submit" class="btn btn-success rounded-pill px-4" th:disabled="${#lists.isEmpty(libros)}">
                            <i class="bi bi-check2-circle me-1"></i> Confirmar Préstamo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
