<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: head('Autores - Biblioteca Kinal')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-3">
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card-custom p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h4 class="fw-bold mb-0 text-dark"><i class="bi bi-pen me-2 text-info"></i>Gestión de Autores</h4>
                <small class="text-muted">Listado de autores registrados</small>
            </div>
            <div>
                <a th:href="@{/autores/nuevo}" class="btn btn-info text-white rounded-pill px-3">
                    <i class="bi bi-plus-lg me-1"></i> Agregar Autor
                </a>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Nacionalidad</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${autores}">
                    <td th:text="${a.id}">1</td>
                    <td class="fw-semibold" th:text="${a.nombre}">Nombre</td>
                    <td th:text="${a.nacionalidad}">Nacionalidad</td>
                    <td class="text-end">
                        <a th:href="@{/autores/editar/{id}(id=${a.id})}" class="btn btn-outline-warning btn-sm rounded-circle" title="Editar">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a th:href="@{/autores/eliminar/{id}(id=${a.id})}" class="btn btn-outline-danger btn-sm rounded-circle ms-1" onclick="return confirm('¿Eliminar este autor?');" title="Eliminar">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(autores)}">
                    <td colspan="4" class="text-center text-muted py-4">No hay autores registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
