<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: head('Catálogo de Libros - Biblioteca Kinal')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-3">
    <!-- Alertas Flash -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card-custom p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h4 class="fw-bold mb-0 text-dark"><i class="bi bi-journal-bookmark me-2 text-primary"></i>Catálogo de Libros</h4>
                <small class="text-muted">Inventario disponible para socios y lectores</small>
            </div>
            <div>
                <a th:if="${session.rolUsuario == 'ADMINISTRADOR'}" th:href="@{/libros/nuevo}" class="btn btn-primary rounded-pill px-3">
                    <i class="bi bi-plus-lg me-1"></i> Agregar Libro
                </a>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>ISBN</th>
                    <th>Año</th>
                    <th>Autor</th>
                    <th>Categoría</th>
                    <th>Copias</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="libro : ${libros}">
                    <td th:text="${libro.id}">1</td>
                    <td class="fw-semibold" th:text="${libro.titulo}">Título</td>
                    <td><code th:text="${libro.isbn}">ISBN</code></td>
                    <td th:text="${libro.anioPublicaciones}">2020</td>
                    <td th:text="${libro.autor != null ? libro.autor.nombre : 'Sin Autor'}">Autor</td>
                    <td>
                        <span class="badge bg-secondary" th:text="${libro.categoria != null ? libro.categoria.nombre : 'General'}">Categoría</span>
                    </td>
                    <td>
                        <span th:if="${libro.copiasDisponibles > 0}" class="badge bg-success" th:text="${libro.copiasDisponibles + ' disponibles'}">5</span>
                        <span th:if="${libro.copiasDisponibles <= 0}" class="badge bg-danger">Agotado</span>
                    </td>
                    <td class="text-end">
                        <a th:if="${libro.copiasDisponibles > 0}" th:href="@{/prestamos/nuevo}" class="btn btn-outline-success btn-sm rounded-pill" title="Prestar">
                            <i class="bi bi-handbag me-1"></i> Prestar
                        </a>
                        <span th:if="${session.rolUsuario == 'ADMINISTRADOR'}">
                            <a th:href="@{/libros/editar/{id}(id=${libro.id})}" class="btn btn-outline-warning btn-sm rounded-circle ms-1" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/libros/eliminar/{id}(id=${libro.id})}" class="btn btn-outline-danger btn-sm rounded-circle ms-1" onclick="return confirm('¿Seguro que deseas eliminar este libro?');" title="Eliminar">
                                <i class="bi bi-trash"></i>
                            </a>
                        </span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(libros)}">
                    <td colspan="8" class="text-center text-muted py-4">No hay libros registrados en el sistema.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
