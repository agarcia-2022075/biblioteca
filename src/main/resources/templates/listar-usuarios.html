<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: head('Usuarios - Biblioteca Kinal')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-3">
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card-custom p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h4 class="fw-bold mb-0 text-dark"><i class="bi bi-person-gear me-2 text-dark"></i>Gestión de Usuarios</h4>
                <small class="text-muted">Cuentas con acceso al sistema y roles</small>
            </div>
            <div>
                <a th:href="@{/usuarios/nuevo}" class="btn btn-dark rounded-pill px-3">
                    <i class="bi bi-person-plus me-1"></i> Crear Usuario
                </a>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Código</th>
                    <th>Usuario</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.codigoUsuario}">1</td>
                    <td class="fw-semibold" th:text="${u.username}">admin</td>
                    <td th:text="${u.email}">correo@kinal.edu.gt</td>
                    <td>
                        <span th:if="${u.rol == 'ADMINISTRADOR' or u.rol == 'ROLE_ADMINISTRADOR'}" class="badge bg-danger">ADMINISTRADOR</span>
                        <span th:if="${u.rol == 'USUARIO' or u.rol == 'ROLE_USUARIO'}" class="badge bg-primary">USUARIO</span>
                    </td>
                    <td>
                        <span th:if="${u.estado == 1}" class="badge bg-success">Activo</span>
                        <span th:if="${u.estado == 0}" class="badge bg-secondary">Inactivo</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/usuarios/eliminar/{id}(id=${u.codigoUsuario})}" class="btn btn-outline-danger btn-sm rounded-circle" onclick="return confirm('¿Eliminar este usuario?');" title="Eliminar">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="6" class="text-center text-muted py-4">No hay usuarios registrados en la base de datos.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
